# Include in the public media host's HTTPS server block.
# Use sanitized access logs without query strings.
location = /rtc {
    proxy_pass http://noctf-media-sfu:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location = /rtc/validate {
    proxy_pass http://noctf-media-sfu:7880;
    proxy_set_header Host $host;
}
location / {
    return 404;
}
