services:
  noctf:
    group_add: ["${LIVE_SOLO_MEDIA_GID:?Set a dedicated media group}"]
    env_file:
      - ./env/live-solo/noctf.env
    volumes:
      - type: bind
        source: ${LIVE_SOLO_SPOOL_PATH:?Prepare a dedicated bounded media spool}
        target: /out
        bind:
          create_host_path: false
    networks:
      media: {}
  media-redis:
    image: redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: [redis-server, /etc/live-solo/redis.conf]
    mem_limit: 1g
    group_add: ["${LIVE_SOLO_MEDIA_GID:?Set a dedicated media group}"]
    volumes:
      - type: bind
        source: ./config/live-solo/redis.conf
        target: /etc/live-solo/redis.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      media: {}
  media-sfu:
    image: livekit/livekit-server:v1.13.9@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
    restart: unless-stopped
    command: [--config, /etc/live-solo/livekit.yaml]
    mem_limit: 2g
    cpus: 2
    group_add: ["${LIVE_SOLO_MEDIA_GID:?Set a dedicated media group}"]
    depends_on: [media-redis]
    ports:
      - target: 7881
        published: "${LIVE_SOLO_RTC_TCP_PORT:-7881}"
        protocol: tcp
      - target: 7882
        published: "${LIVE_SOLO_RTC_UDP_PORT:-7882}"
        protocol: udp
    volumes:
      - type: bind
        source: ./config/live-solo/livekit.yaml
        target: /etc/live-solo/livekit.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      media: {}
      proxy:
        aliases: [noctf-media-sfu]
  media-egress:
    image: livekit/egress:v1.15.0@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/live-solo/egress.yaml
    working_dir: /out
    cap_add: [SYS_ADMIN]
    group_add: ["${LIVE_SOLO_MEDIA_GID:?Set a dedicated media group}"]
    cpus: ${LIVE_SOLO_EGRESS_CPUS:-4}
    mem_limit: ${LIVE_SOLO_EGRESS_MEMORY:-4g}
    depends_on: [media-sfu, media-redis]
    volumes:
      - type: bind
        source: ${LIVE_SOLO_SPOOL_PATH:?Prepare a dedicated bounded media spool}/.egress-tmp
        target: /home/egress/tmp
        bind:
          create_host_path: false
      - type: bind
        source: ./config/live-solo/egress.yaml
        target: /etc/live-solo/egress.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIVE_SOLO_SPOOL_PATH:?Prepare a dedicated bounded media spool}
        target: /out
        bind:
          create_host_path: false
    networks:
      media: {}
networks:
  media:
    name: ${COMPOSE_PROJECT_NAME:-noctf}-media
    driver: bridge
