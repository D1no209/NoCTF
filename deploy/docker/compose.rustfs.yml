services:
  rustfs:
    image: ${RUSTFS_IMAGE:?Set RUSTFS_IMAGE}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      RUSTFS_REGION: us-east-1
    user: "10001:10001"
    volumes:
    - type: bind
      source: ./data/rustfs
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ./data/rustfs-logs
      target: /logs
      bind:
        create_host_path: false
    mem_limit: 2g
  noctf:
    depends_on: [postgres, redis, nats, rustfs]
    environment:
      Storage__Provider: S3
      Storage__S3__ServiceUrl: http://rustfs:9000
      Storage__S3__Bucket: ${S3_BUCKET:-noctf}
      Storage__S3__Region: us-east-1
      Storage__S3__ForcePathStyle: "true"
      Storage__S3__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      Storage__S3__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      Storage__PublicBaseUrl: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL}
  storage-init:
    image: ${NOCTF_PLATFORM_IMAGE:?Set NOCTF_PLATFORM_IMAGE}
    profiles: [init]
    command: [--initialize-storage-only]
    env_file: [./env/noctf/.env]
    environment:
      Storage__Provider: S3
      Storage__S3__ServiceUrl: http://rustfs:9000
      Storage__S3__Bucket: ${S3_BUCKET:-noctf}
      Storage__S3__Region: us-east-1
      Storage__S3__ForcePathStyle: "true"
      Storage__S3__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      Storage__S3__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
