map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name noctf.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noctf.example.com;

    ssl_certificate /etc/letsencrypt/live/noctf.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noctf.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Kestrel owns Brotli/Gzip selection so direct and proxied deployments use
    # identical encodings and Vary headers. Do not recompress upstream bodies.
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # Nginx is the sole trusted public edge. Discard any client-supplied
        # forwarding chain so ASP.NET Core receives one symmetric hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
