global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: noctf
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080
        labels:
          role: api
      - targets:
          - worker:8080
        labels:
          role: worker
      - targets:
          - runner:8080
        labels:
          role: runner

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
