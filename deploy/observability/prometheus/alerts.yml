groups:
  - name: noctf-messaging
    rules:
      - alert: NoCtfNatsUnavailable
        expr: (max(up{job="nats"}) or vector(0)) == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "NATS Exporter 或 NATS 监控接口不可用"

      - alert: NoCtfCriticalQueuePending
        expr: >-
          (sum(max by (stream_name, consumer_name)
          (jetstream_consumer_num_pending{is_consumer_leader="true",stream_name=~"NOCTF_CONTROL|NOCTF_GAMEPLAY"}))
          or vector(0)) > 100
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "JetStream 关键消费者持续待投递超过 100 条"

      - alert: NoCtfCriticalQueueAckPending
        expr: >-
          (sum(max by (stream_name, consumer_name)
          (jetstream_consumer_num_ack_pending{is_consumer_leader="true",stream_name=~"NOCTF_CONTROL|NOCTF_GAMEPLAY"}))
          or vector(0)) > 50
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "JetStream 关键消费者持续未确认超过 50 条"

      - alert: NoCtfCriticalQueueRedelivered
        expr: >-
          (sum(max by (stream_name, consumer_name)
          (jetstream_consumer_num_redelivered{is_consumer_leader="true",stream_name=~"NOCTF_CONTROL|NOCTF_GAMEPLAY"}))
          or vector(0)) > 10
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "JetStream 关键消费者持续重投递超过 10 条"

      - alert: NoCtfWolverineOutboxBacklog
        expr: sum(wolverine_outbox_count_Messages) > 100
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Wolverine Outbox 持续积压超过 100 条"

      - alert: NoCtfWolverineInboxBacklog
        expr: sum(wolverine_inbox_count_Messages) > 100
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Wolverine Inbox 持续积压超过 100 条"

      - alert: NoCtfWolverineTransactionalMetricsMissing
        expr: absent(wolverine_outbox_count_Messages) == 1 or absent(wolverine_inbox_count_Messages) == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Wolverine Inbox/Outbox 指标缺失"

  - name: noctf-saturation-and-latency
    rules:
      - alert: NoCtfRuntimeWaitingTooLong
        expr: max(noctf_runtime_waiting_oldest_age_seconds) > 30
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Runtime 最长等待时间超过 30 秒"

      - alert: NoCtfLeaderboardMergeDispatchFailing
        expr: sum(rate(noctf_leaderboard_merge_dispatches_total{outcome="failure"}[5m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "排行榜合并投影分发持续失败"

      - alert: NoCtfLeaderboardCacheMissRebuildFailing
        expr: sum(rate(noctf_leaderboard_cache_miss_rebuilds_total{outcome="failure"}[5m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "排行榜缓存缺失重建持续失败"

      - alert: NoCtfLeaderboardProjectionSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(noctf_leaderboard_projection_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "排行榜投影 P95 持续超过 2 秒"

      - alert: NoCtfLeaderboardPublishFailing
        expr: sum(rate(noctf_leaderboard_publish_failures_total[5m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "排行榜缓存发布持续失败"

      - alert: NoCtfLeaderboardSignalRPublishFailing
        expr: sum(rate(noctf_signalr_publishes_total{endpoint="leaderboard",outcome="failure"}[5m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "排行榜 SignalR 发布持续失败"

      - alert: NoCtfApiP95High
        expr: histogram_quantile(0.95, sum by (le, endpoint) (rate(noctf_api_request_duration_seconds_bucket[5m]))) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "API P95 持续高于 800ms"

      - alert: NoCtfApiServerErrorRateHigh
        expr: sum(rate(noctf_api_requests_total{outcome="server_error"}[5m])) / clamp_min(sum(rate(noctf_api_requests_total[5m])), 1) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "API 5xx 比例超过 2%"

      - alert: NoCtfPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / clamp_min(pg_settings_max_connections, 1) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL 连接使用率超过 80%"

      - alert: NoCtfRedisP99High
        expr: histogram_quantile(0.99, sum by (le, endpoint) (rate(noctf_redis_operation_duration_seconds_bucket[5m]))) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "NoCTF Redis 操作 P99 超过 50ms"

      - alert: NoCtfRunnerCapacityLow
        expr: min by (pool) (sum by (pool, resource) (noctf_runner_capacity_available{role="runner"}) / clamp_min(sum by (pool, resource) (noctf_runner_capacity_total{role="runner"}), 1)) < 0.15
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Runner 资源池剩余容量低于 15%"

      - alert: NoCtfRunnerUnavailable
        expr: (sum(noctf_runner_online{role="runner"}) or vector(0)) < 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "没有在线 Runner"

      - alert: NoCtfDiskSpaceLow
        expr: min by (instance) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "主机磁盘剩余空间低于 15%"
