noctf_runtime:
  query: |
    SELECT
      count(*)::double precision AS waiting,
      coalesce(
        extract(epoch FROM (current_timestamp - min(created_at))),
        0
      )::double precision AS waiting_oldest_age_seconds
    FROM runtime_instances
    WHERE state = 0
  metrics:
    - waiting:
        usage: GAUGE
        description: Number of Runtime instances waiting for provisioning.
    - waiting_oldest_age_seconds:
        usage: GAUGE
        description: Age in seconds of the oldest Runtime waiting for provisioning.
