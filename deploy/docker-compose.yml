services:
  postgres:
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noctf}
      POSTGRES_USER: ${POSTGRES_USER:-noctf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noctf} -d ${POSTGRES_DB:-noctf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    labels:
      noctf.io/internal-role: scoring-callback-gateway
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Authentication__SigningKey: ${JWT_SECRET:?set JWT_SECRET}
      Authentication__Issuer: ${JWT_ISSUER:-NoCTF}
      Authentication__Audience: ${JWT_AUDIENCE:-NoCTF.Api}
      Authentication__RefreshCookieSecure: ${AUTHENTICATION_REFRESH_COOKIE_SECURE:-true}
      RunnerScoring__SigningKey: ${RUNNER_SCORING_SECRET:-${JWT_SECRET}}
      RunnerScoring__Issuer: ${RUNNER_SCORING_ISSUER:-NoCTF.Runner}
      RunnerScoring__Audience: ${RUNNER_SCORING_AUDIENCE:-NoCTF.ScoringInput}
      Runtime__Provider: ${RUNNER_PROVIDER:-Docker}
      Runtime__RunnerPool: ${RUNNER_POOL:-default}
      ForwardedHeaders__KnownNetworks__0: ${NOCTF_REVERSE_PROXY_NETWORK:-172.16.0.0/12}
      ForwardedHeaders__AllowedHosts__0: ${NOCTF_PUBLIC_HOST:-noctf.local}
      Database__AutoMigrate: "false"
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@noctf.local}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:-admin}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      Storage__Provider: Local
      Storage__LocalRoot: /app/uploads
      Storage__PublicBaseUrl: ${NOCTF_STORAGE_PUBLIC_BASE_URL:-http://backend:8080}
      EmailVerification__EncryptionKey: ${EMAIL_VERIFICATION_ENCRYPTION_KEY:?set EMAIL_VERIFICATION_ENCRYPTION_KEY}
    volumes:
      - backend_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${NOCTF_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6

  migration:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ConnectionStrings__PostgreSql: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Authentication__SigningKey: ${JWT_SECRET:?set JWT_SECRET}
      RunnerScoring__SigningKey: ${RUNNER_SCORING_SECRET:-${JWT_SECRET:?set JWT_SECRET}}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@noctf.local}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:-admin}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      Storage__Provider: Local
      Storage__LocalRoot: /app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Authentication__SigningKey: ${JWT_SECRET:?set JWT_SECRET}
      RunnerScoring__SigningKey: ${RUNNER_SCORING_SECRET:-${JWT_SECRET}}
      RunnerScoring__Issuer: ${RUNNER_SCORING_ISSUER:-NoCTF.Runner}
      RunnerScoring__Audience: ${RUNNER_SCORING_AUDIENCE:-NoCTF.ScoringInput}
      Runtime__Provider: ${RUNNER_PROVIDER:-Docker}
      Runtime__RunnerPool: ${RUNNER_POOL:-default}
      Storage__Provider: Local
      Storage__LocalRoot: /app/uploads
      EmailVerification__EncryptionKey: ${EMAIL_VERIFICATION_ENCRYPTION_KEY:?set EMAIL_VERIFICATION_ENCRYPTION_KEY}
    volumes:
      - backend_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    depends_on:
      migration:
        condition: service_completed_successfully

  runner:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runner
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      Runner__Provider: ${RUNNER_PROVIDER:-Docker}
      Runner__Pool: ${RUNNER_POOL:-default}
      Runner__Id: ${RUNNER_ID:-docker-runner-1}
      Runner__Capacity__MemoryBytes: ${RUNNER_CAPACITY_MEMORY_BYTES:-4294967296}
      Runner__Capacity__NanoCpus: ${RUNNER_CAPACITY_NANO_CPUS:-2000000000}
      Runner__Capacity__PidsLimit: ${RUNNER_CAPACITY_PIDS_LIMIT:-2048}
      Runner__Heartbeat__IntervalSeconds: ${RUNNER_HEARTBEAT_INTERVAL_SECONDS:-5}
      Runner__Heartbeat__TtlSeconds: ${RUNNER_HEARTBEAT_TTL_SECONDS:-15}
      Runner__ProviderFailureHoldSeconds: ${RUNNER_PROVIDER_FAILURE_HOLD_SECONDS:-120}
      ConnectionStrings__PostgreSql: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      RunnerScoring__SigningKey: ${RUNNER_SCORING_SECRET:-${JWT_SECRET}}
      RunnerScoring__Issuer: ${RUNNER_SCORING_ISSUER:-NoCTF.Runner}
      RunnerScoring__Audience: ${RUNNER_SCORING_AUDIENCE:-NoCTF.ScoringInput}
      RunnerScoring__CallbackBaseUrl: http://backend:8080
      Runtime__Docker__CallbackContainerLabelValue: scoring-callback-gateway
      Runtime__Docker__Endpoint: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      Runtime__Docker__Network: noctf-network
      Runtime__Docker__PublicHost: ${DOCKER_PUBLISHED_HOST:-host.docker.internal}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:

networks:
  default:
    name: noctf-network
