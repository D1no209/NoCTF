services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noctf}
      POSTGRES_USER: ${POSTGRES_USER:-noctf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noctf} -d ${POSTGRES_DB:-noctf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER:-NoCTF}
      JwtSettings__Audience: ${JWT_AUDIENCE:-NoCTF}
      Database__AutoMigrate: "true"
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@noctf.local}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:-admin}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-Admin@123456}
      StorageProvider__Local__BasePath: /app/uploads
      Runner__BaseUrl: http://runner:8080
      Docker__Host: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - backend_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_started
    ports:
      - "80:8080"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      StorageProvider__Local__BasePath: /app/uploads
      Runner__BaseUrl: http://runner:8080
      Docker__Host: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - backend_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_started

  runner:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runner
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      Docker__Host: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"

volumes:
  postgres_data:
  minio_data:
  backend_uploads:
