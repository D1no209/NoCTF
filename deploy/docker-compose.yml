services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noctf}
      POSTGRES_USER: ${POSTGRES_USER:-noctf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noctf} -d ${POSTGRES_DB:-noctf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER:-NoCTF}
      JwtSettings__Audience: ${JWT_AUDIENCE:-NoCTF}
      Database__AutoMigrate: "false"
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@noctf.local}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:-admin}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      StorageProvider__Local__BasePath: /app/uploads
      StorageProvider__Local__UrlSigningKey: ${LOCAL_STORAGE_URL_SIGNING_KEY:?set LOCAL_STORAGE_URL_SIGNING_KEY}
      StorageProvider__PublicBaseUrl: ${NOCTF_STORAGE_PUBLIC_BASE_URL:-http://backend:8080}
      Runner__BaseUrl: http://runner:8080
      Runner__Provider: ${RUNNER_PROVIDER:-Docker}
      Runner__ApiKey: ${RUNNER_API_KEY:?set RUNNER_API_KEY}
      Runner__UtilityNetwork: ${RUNNER_UTILITY_NETWORK:-deploy_default}
      InstanceAccess__PublicHost: ${NOCTF_PUBLIC_HOST:-}
    volumes:
      - backend_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_started
      migration:
        condition: service_completed_successfully
    ports:
      - "80:8080"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      StorageProvider__Local__BasePath: /app/uploads
      StorageProvider__Local__UrlSigningKey: ${LOCAL_STORAGE_URL_SIGNING_KEY:?set LOCAL_STORAGE_URL_SIGNING_KEY}
      StorageProvider__PublicBaseUrl: ${NOCTF_STORAGE_PUBLIC_BASE_URL:-http://backend:8080}
      Runner__BaseUrl: http://runner:8080
      Runner__Provider: ${RUNNER_PROVIDER:-Docker}
      Runner__ApiKey: ${RUNNER_API_KEY:?set RUNNER_API_KEY}
      Runner__UtilityNetwork: ${RUNNER_UTILITY_NETWORK:-deploy_default}
      InstanceAccess__PublicHost: ${NOCTF_PUBLIC_HOST:-}
      Worker__Concurrency: ${WORKER_CONCURRENCY:-4}
      Worker__LongRunningConcurrency: ${WORKER_LONG_RUNNING_CONCURRENCY:-1}
      Awd__MaxConcurrentContainerRefreshes: ${AWD_CONTAINER_REFRESH_CONCURRENCY:-4}
      Koh__MaxConcurrentPolls: ${KOH_POLL_CONCURRENCY:-8}
    volumes:
      - backend_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_started
      migration:
        condition: service_completed_successfully

  migration:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-noctf};Username=${POSTGRES_USER:-noctf};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      JwtSettings__Secret: ${JWT_SECRET:?set JWT_SECRET}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@noctf.local}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:-admin}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      StorageProvider__Local__BasePath: /app/uploads
      StorageProvider__Local__UrlSigningKey: ${LOCAL_STORAGE_URL_SIGNING_KEY:?set LOCAL_STORAGE_URL_SIGNING_KEY}
      Runner__BaseUrl: http://runner:8080
      Runner__ApiKey: ${RUNNER_API_KEY:?set RUNNER_API_KEY}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_started

  runner:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runner
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      Runner__Provider: ${RUNNER_PROVIDER:-Docker}
      Runner__ApiKey: ${RUNNER_API_KEY:?set RUNNER_API_KEY}
      Runner__AllowedRegistries: ${RUNNER_ALLOWED_REGISTRIES:-docker.io,ghcr.io,quay.io,registry.k8s.io,localhost}
      Runner__AllowedNetworks: ${RUNNER_ALLOWED_NETWORKS:-deploy_default}
      Runner__Concurrency__PermitLimit: ${RUNNER_CONCURRENCY_LIMIT:-8}
      Runner__Concurrency__QueueLimit: ${RUNNER_QUEUE_LIMIT:-64}
      Runner__OperationReceiptMinutes: ${RUNNER_RECEIPT_MINUTES:-30}
      Runner__OperationReceiptLimit: ${RUNNER_RECEIPT_LIMIT:-512}
      Runner__MaxOperationSeconds: ${RUNNER_MAX_OPERATION_SECONDS:-1800}
      Runner__MaxRequestBodyBytes: ${RUNNER_MAX_REQUEST_BODY_BYTES:-4194304}
      Docker__Host: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      Docker__PublishedHost: ${DOCKER_PUBLISHED_HOST:-host.docker.internal}
      Docker__RuntimeOrphanGraceHours: ${DOCKER_RUNTIME_ORPHAN_GRACE_HOURS:-168}
      K8s__PublicEntry: ${K8S_PUBLIC_ENTRY:-}
      K8s__IngressBaseDomain: ${K8S_INGRESS_BASE_DOMAIN:-}
      K8s__RuntimeOrphanGraceSeconds: ${K8S_RUNTIME_ORPHAN_GRACE_SECONDS:-604800}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    expose:
      - "8080"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:
