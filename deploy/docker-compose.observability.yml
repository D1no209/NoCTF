services:
  backend:
    environment:
      ASPNETCORE_URLS: http://+:8080;http://+:9464
      Observability__MetricsPort: 9464
      Observability__PrometheusBaseUrl: http://prometheus:9090
      Observability__GrafanaPublicUrl: ${NOCTF_GRAFANA_PUBLIC_URL:-}
      Observability__Monitoring__SustainedWindowMinutes: ${NOCTF_MONITORING_SUSTAINED_WINDOW_MINUTES:-3}
      Observability__Monitoring__PendingWarning: ${NOCTF_MONITORING_PENDING_WARNING:-25}
      Observability__Monitoring__PendingCritical: ${NOCTF_MONITORING_PENDING_CRITICAL:-100}
      Observability__Monitoring__AckPendingWarning: ${NOCTF_MONITORING_ACK_PENDING_WARNING:-10}
      Observability__Monitoring__AckPendingCritical: ${NOCTF_MONITORING_ACK_PENDING_CRITICAL:-50}
      Observability__Monitoring__RedeliveryWarning: ${NOCTF_MONITORING_REDELIVERY_WARNING:-1}
      Observability__Monitoring__RedeliveryCritical: ${NOCTF_MONITORING_REDELIVERY_CRITICAL:-10}
      Observability__Monitoring__OutboxWarning: ${NOCTF_MONITORING_OUTBOX_WARNING:-25}
      Observability__Monitoring__OutboxCritical: ${NOCTF_MONITORING_OUTBOX_CRITICAL:-100}
      Observability__Monitoring__InboxWarning: ${NOCTF_MONITORING_INBOX_WARNING:-25}
      Observability__Monitoring__InboxCritical: ${NOCTF_MONITORING_INBOX_CRITICAL:-100}
      Observability__Monitoring__JetStreamStorageWarningPercent: ${NOCTF_MONITORING_JS_STORAGE_WARNING_PERCENT:-75}
      Observability__Monitoring__JetStreamStorageCriticalPercent: ${NOCTF_MONITORING_JS_STORAGE_CRITICAL_PERCENT:-90}

  worker:
    environment:
      ASPNETCORE_URLS: http://+:8080;http://+:9464
      Observability__MetricsPort: 9464

  runner:
    environment:
      ASPNETCORE_URLS: http://+:8080;http://+:9464
      Observability__MetricsPort: 9464

  prometheus:
    image: quay.io/prometheus/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
      runner:
        condition: service_healthy
      nats-exporter:
        condition: service_started

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${POSTGRES_USER:-noctf}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noctf}?sslmode=disable
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: quay.io/oliver006/redis_exporter:v1.89.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy

  nats-exporter:
    image: docker.m.daocloud.io/natsio/prometheus-nats-exporter:0.20.1@sha256:4fbf6dacb84780a45a1c3af9b1080c69451a288d20902deae671b80717bb8f61
    restart: unless-stopped
    command:
      - -varz
      - -jsz=all
      - http://nats:8222
    expose:
      - "7777"
    depends_on:
      nats:
        condition: service_healthy

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"

volumes:
  prometheus_data:
  grafana_data:
