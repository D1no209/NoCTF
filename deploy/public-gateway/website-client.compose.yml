services:
  website-connector:
    image: ${NOCTF_GATEWAY_IMAGE:?CI-produced digest reference is required}
    entrypoint: [/usr/local/bin/frpc, -c, /config/frpc.toml]
    network_mode: host
    env_file: ./website-client.env
    volumes:
      - ./website-client:/config
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
