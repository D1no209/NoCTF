apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: noctf
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: noctf-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: noctf
    namespace: envoy-gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: noctf
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  nodeSelector:
                    noctf.io/node-role: platform
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
              - port: 80
                nodePort: 30000
              - port: 443
                nodePort: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: noctf
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  gatewayClassName: noctf-envoy
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: noctf-tls
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  parentRefs:
  - name: noctf
    sectionName: https
  hostnames:
  - noctf.invalid
  rules:
  - timeouts:
      request: 0s
    backendRefs:
    - name: backend-service
      port: 8080
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Host
          value: '%REQ(:AUTHORITY)%'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: files
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  parentRefs:
  - name: noctf
    sectionName: https
  hostnames:
  - files.noctf.invalid
  rules:
  - timeouts:
      request: 0s
    backendRefs:
    - name: rustfs
      port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  parentRefs:
  - name: noctf
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
        port: 443
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: noctf
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: noctf
  headers:
    enableEnvoyHeaders: false
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 0
  timeout:
    http:
      idleTimeout: 3600s
