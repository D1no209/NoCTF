apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../shared/observability
- 00-runtime-namespace.yaml
- 01-runtime-networkpolicy.yaml
- backend-deployment.yaml
- backend-service.yaml
- configmap.yaml
- gateway.yaml
- grafana.yaml
- loki.yaml
- rustfs-deployment.yaml
- rustfs-pvc.yaml
- rustfs-service.yaml
- namespace.yaml
- nats.yaml
- nats-exporter.yaml
- networkpolicy.yaml
- postgres-deployment.yaml
- postgres-pvc.yaml
- postgres-service.yaml
- prometheus.yaml
- redis-deployment.yaml
- redis-pvc.yaml
- redis-service.yaml
- runner-deployment.yaml
- runner-rbac.yaml
- runner-service.yaml
- worker-deployment.yaml
configMapGenerator:
- name: prometheus-config
  namespace: noctf
  files:
  - prometheus.yml
- name: grafana-datasources
  namespace: noctf
  files:
  - datasources.yml
- name: grafana-dashboards
  namespace: noctf
  files:
  - dashboards.yml
- name: grafana-dashboard-kubernetes
  namespace: noctf
  files:
  - noctf-kubernetes.json
