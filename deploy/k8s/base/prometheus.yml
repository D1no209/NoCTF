global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/rules/recording-rules.yml
- /etc/prometheus/rules/alerts.yml
scrape_configs:
- job_name: noctf
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - noctf
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    regex: backend|worker|runner
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    regex: '9464'
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_label_app
    target_label: role
- job_name: nats
  static_configs:
  - targets: [nats-exporter:7777]
