apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy
    ports:
    - port: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scoring-callback-to-backend
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: backend
      noctf.io/internal-role: scoring-callback-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: runtime
      podSelector:
        matchExpressions:
        - key: noctf.io/purpose
          operator: In
          values:
          - awd-checker
          - awdp-checker
    ports:
    - port: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-runtime-proxy-targets
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      noctf.io/runtime-proxy-gateway: 'true'
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: runtime
      podSelector:
        matchLabels:
          noctf.io/runtime-proxy-target: 'true'
