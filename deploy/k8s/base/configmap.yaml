  Runtime__Execution__ProcessesPerService: '256'
  Runtime__Kubernetes__ClusterDomain: cluster.local
  Runtime__Kubernetes__ClusterDnsServiceAddress: 10.97.0.10
  Runtime__Kubernetes__CallbackNamespaceLabelKey: kubernetes.io/metadata.name
