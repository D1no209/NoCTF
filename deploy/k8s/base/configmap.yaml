  HumanVerification__Validation__PublicOrigin: https://noctf.invalid
  SeedAdmin__UserName: admin
  SeedAdmin__Email: admin@noctf.invalid
  Observability__Enabled: 'true'
  Observability__LokiBaseUrl: http://loki:3100/
  Observability__RequireLoki: 'true'
