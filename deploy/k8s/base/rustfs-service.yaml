apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: noctf
  labels:
    app: rustfs
    app.kubernetes.io/part-of: noctf
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
  type: ClusterIP
