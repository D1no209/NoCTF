apiVersion: v1
kind: ServiceAccount
metadata:
  name: noctf-runner
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: noctf-runner
  labels:
    app.kubernetes.io/part-of: noctf
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["secrets", "resourcequotas", "limitranges", "configmaps"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noctf-runner
  labels:
    app.kubernetes.io/part-of: noctf
subjects:
  - kind: ServiceAccount
    name: noctf-runner
    namespace: noctf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: noctf-runner
