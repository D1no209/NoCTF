apiVersion: v1
kind: ConfigMap
metadata:
  name: noctf-config
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
data:
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  ConnectionStrings__Redis: "redis:6379"
  Authentication__Issuer: "NoCTF"
  Authentication__Audience: "NoCTF.Api"
  Authentication__AccessTokenMinutes: "15"
  Authentication__RefreshCookieSecure: "true"
  RunnerScoring__Issuer: "NoCTF.Runner"
  RunnerScoring__Audience: "NoCTF.ScoringInput"
  RunnerScoring__LifetimeSeconds: "300"
  Storage__Provider: "S3"
  Storage__S3__ServiceUrl: "http://minio:9000"
  Storage__S3__Bucket: "noctf"
  Storage__S3__ForcePathStyle: "true"
  Storage__PublicBaseUrl: "https://minio.noctf.local"
  EmailVerification__Enabled: "false"
  EmailVerification__PublicBaseUrl: "https://noctf.local"
  EmailVerification__TokenLifetimeMinutes: "1440"
  EmailVerification__ResendCooldownSeconds: "60"
  EmailVerification__Smtp__Host: ""
  EmailVerification__Smtp__Port: "587"
  EmailVerification__Smtp__EnableSsl: "true"
  EmailVerification__Smtp__FromAddress: ""
  EmailVerification__Smtp__FromName: "NoCTF"
  EmailVerification__Smtp__TimeoutSeconds: "10"
  Runner__Provider: "Kubernetes"
  Runner__Pool: "kubernetes"
  Runner__Id: "kubernetes-runner-1"
  RunnerScoring__CallbackBaseUrl: "http://backend:8080"
  Runtime__Kubernetes__Namespace: "runtime"
  Runtime__Kubernetes__PublicHost: "noctf.local"
  Runtime__Kubernetes__PodPidsLimit: "512"
  Runtime__Kubernetes__ClusterDomain: "cluster.local"
  Runtime__Kubernetes__ClusterDnsServiceAddress: "10.43.0.10"
  Runtime__Kubernetes__NetworkPolicyRequired: "true"
  Runtime__Kubernetes__ProtectedCidrs__0: "10.0.0.0/8"
  Runtime__Kubernetes__ProtectedCidrs__1: "172.16.0.0/12"
  Runtime__Kubernetes__ProtectedCidrs__2: "192.168.0.0/16"
  Notifications__RedisStream__MaxPayloadBytes: "65536"
  Koh__MaxConcurrentPolls: "8"
  Awd__MaxConcurrentContainerRefreshes: "4"
  ForwardedHeaders__TrustAll: "true"
  Cors__AllowedOrigins__0: "https://noctf.local"
  Database__AutoMigrate: "false"
