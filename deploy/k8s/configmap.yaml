apiVersion: v1
kind: ConfigMap
metadata:
  name: noctf-config
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
data:
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  ConnectionStrings__Redis: "redis:6379"
  JwtSettings__Issuer: "NoCTF"
  JwtSettings__Audience: "NoCTF"
  JwtSettings__ExpiryMinutes: "60"
  StorageProvider__Type: "S3"
  StorageProvider__S3__Endpoint: "http://minio:9000"
  StorageProvider__S3__Bucket: "noctf"
  StorageProvider__S3__Region: "us-east-1"
  StorageProvider__PublicBaseUrl: "https://minio.noctf.local"
  Runner__BaseUrl: "http://runner:8080"
  Runner__TimeoutSeconds: "900"
  Runner__Provider: "Kubernetes"
  Runner__AllowedRegistries: "docker.io,ghcr.io,quay.io,registry.k8s.io,localhost"
  Runner__Concurrency__PermitLimit: "8"
  Runner__Concurrency__QueueLimit: "64"
  Runner__OperationReceiptMinutes: "30"
  Runner__OperationReceiptLimit: "512"
  Runner__MaxOperationSeconds: "1800"
  Runner__MaxRequestBodyBytes: "4194304"
  Worker__Concurrency: "4"
  Worker__LongRunningConcurrency: "1"
  Notifications__RedisStream__MaxPayloadBytes: "65536"
  Koh__MaxConcurrentPolls: "8"
  Awd__MaxConcurrentContainerRefreshes: "4"
  K8s__NamespacePrefix: "noctf-inst"
  K8s__DefaultExposure: "NodePort"
  K8s__NetworkMode: "Isolated"
  K8s__PublicEntry: "noctf.local"
  K8s__IngressBaseDomain: "challenges.noctf.local"
  K8s__ReadinessTimeoutSeconds: "120"
  K8s__RuntimeOrphanGraceSeconds: "604800"
  ForwardedHeaders__TrustAll: "true"
  Cors__AllowedOrigins__0: "https://noctf.local"
  Database__AutoMigrate: "false"
