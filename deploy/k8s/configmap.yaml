apiVersion: v1
kind: ConfigMap
metadata:
  name: noctf-config
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
data:
  ASPNETCORE_HTTP_PORTS: "8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  Worker__Queues__0: "control"
  Worker__Queues__1: "gameplay"
  Worker__Queues__2: "projection"
  Worker__Queues__3: "background"
  Worker__Concurrency__Control: "2"
  Worker__Concurrency__Gameplay: "8"
  Worker__Concurrency__Projection: "2"
  Worker__Concurrency__Background: "2"
  ConnectionStrings__Redis: "redis:6379"
  Authentication__Issuer: "NoCTF"
  Authentication__Audience: "NoCTF.Api"
  Authentication__AccessTokenMinutes: "15"
  HumanVerification__Provider: "None"
  RunnerScoring__Issuer: "NoCTF.Runner"
  RunnerScoring__Audience: "NoCTF.ScoringInput"
  RunnerScoring__LifetimeSeconds: "300"
  Storage__Provider: "S3"
  Storage__S3__ServiceUrl: "http://minio:9000"
  Storage__S3__Bucket: "noctf"
  Storage__S3__Region: "us-east-1"
  Storage__S3__ForcePathStyle: "true"
  Storage__PublicBaseUrl: "https://minio.noctf.local"
  Runner__Provider: "Kubernetes"
  Runner__Pool: "kubernetes"
  Runner__Capacity__MemoryBytes: "4294967296"
  Runner__Capacity__NanoCpus: "2000000000"
  Runner__Capacity__PidsLimit: "2048"
  Runner__Heartbeat__IntervalSeconds: "5"
  Runner__Heartbeat__TtlSeconds: "15"
  Runner__ProviderFailureHoldSeconds: "120"
  RunnerScoring__CallbackBaseUrl: "http://backend-service.noctf.svc.cluster.local:8080"
  Runtime__Kubernetes__Namespace: "runtime"
  Runtime__Kubernetes__PublicHost: "noctf.local"
  Runtime__Kubernetes__PodPidsLimit: "512"
  Runtime__Kubernetes__ClusterDomain: "cluster.local"
  Runtime__Kubernetes__ClusterDnsServiceAddress: "10.43.0.10"
  Runtime__Kubernetes__CallbackNamespaceLabelKey: "kubernetes.io/metadata.name"
  Runtime__Kubernetes__CallbackNamespaceLabelValue: "noctf"
  Runtime__Kubernetes__CallbackPodLabelKey: "noctf.io/internal-role"
  Runtime__Kubernetes__CallbackPodLabelValue: "scoring-callback-gateway"
  Runtime__Kubernetes__NetworkPolicyRequired: "true"
  Runtime__Kubernetes__ProtectedCidrs__0: "10.0.0.0/8"
  Runtime__Kubernetes__ProtectedCidrs__1: "172.16.0.0/12"
  Runtime__Kubernetes__ProtectedCidrs__2: "192.168.0.0/16"
  Notifications__RedisStream__MaxPayloadBytes: "65536"
  Koh__MaxConcurrentPolls: "8"
  Awd__MaxConcurrentContainerRefreshes: "4"
  # Replace this example with the exact ingress-controller Pod CIDR.
  ForwardedHeaders__KnownNetworks__0: "10.0.0.0/8"
  ForwardedHeaders__AllowedHosts__0: "noctf.local"
  Cors__AllowedOrigins__0: "https://noctf.local"
  Database__AutoMigrate: "false"
