# Copy this file outside the repository, replace the example FQDN and port with
# the exact endpoint configured in Platform Settings, then apply that copy.
# Do not commit production SMTP endpoints or credentials.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: noctf-smtp-egress
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - backend
          - worker
  egress:
    # Cilium must observe the exact DNS answer before toFQDNs can admit the
    # resolved address. Keep this scoped to cluster DNS and the configured
    # SMTP name; do not replace matchName with a wildcard.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: smtp.example.com
    - toFQDNs:
        - matchName: smtp.example.com
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
