apiVersion: batch/v1
kind: Job
metadata:
  name: noctf-db-migrate
  namespace: noctf
  labels:
    app: migration
    app.kubernetes.io/part-of: noctf
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: noctf-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "NoCTF.API.dll", "--migrate-only"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: noctf-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: db-password
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=noctf;Username=postgres;Password=$(DB_PASSWORD)"
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: jwt-secret
            - name: SeedAdmin__Password
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: seed-admin-password
            - name: Runner__ApiKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: runner-api-key
            - name: StorageProvider__S3__AccessKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: minio-access-key
            - name: StorageProvider__S3__SecretKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: minio-secret-key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
