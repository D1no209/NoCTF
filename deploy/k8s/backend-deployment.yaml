apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: noctf
  labels:
    app: backend
    app.kubernetes.io/part-of: noctf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: noctf-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: noctf-config
          env:
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: jwt-secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: db-password
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=noctf;Username=postgres;Password=$(DB_PASSWORD)"
            - name: SeedAdmin__Password
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: seed-admin-password
            - name: Runner__ApiKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: runner-api-key
            - name: StorageProvider__S3__AccessKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: minio-access-key
            - name: StorageProvider__S3__SecretKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: minio-secret-key
            - name: EmailVerification__Smtp__UserName
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: smtp-username
                  optional: true
            - name: EmailVerification__Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: smtp-password
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # AWD challenge mode requires Docker socket access for container orchestration.
          # Kubernetes-backed Runner is the recommended production boundary.
          # Uncomment the Docker socket volumeMount and volume below only for Docker-backed Runner testing.
          # volumeMounts:
          #   - name: docker-sock
          #     mountPath: /var/run/docker.sock
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      # Docker-backed testing may add this volume:
      #   - name: docker-sock
      #     hostPath:
      #       path: /var/run/docker.sock
      #       type: Socket
