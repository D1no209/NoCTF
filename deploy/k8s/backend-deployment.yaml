apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: noctf
  labels:
    app: backend
    app.kubernetes.io/part-of: noctf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        noctf.io/internal-role: scoring-callback-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: noctf-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: noctf-config
          env:
            - name: Authentication__SigningKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: jwt-secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: db-password
            - name: ConnectionStrings__PostgreSql
              value: "Host=postgres;Port=5432;Database=noctf;Username=postgres;Password=$(DB_PASSWORD)"
            - name: SeedAdmin__Password
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: seed-admin-password
            - name: RunnerScoring__SigningKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: runner-scoring-key
            - name: Storage__S3__AccessKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: minio-access-key
            - name: Storage__S3__SecretKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: minio-secret-key
            - name: EmailVerification__EncryptionKey
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: email-verification-encryption-key
            - name: HumanVerification__Cap__Secret
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: cap-secret
                  optional: true
            - name: HumanVerification__Turnstile__Secret
              valueFrom:
                secretKeyRef:
                  name: noctf-secrets
                  key: turnstile-secret
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # AWD challenge mode requires Docker socket access for container orchestration.
          # Kubernetes-backed Runner is the recommended production boundary.
          # Uncomment the Docker socket volumeMount and volume below only for Docker-backed Runner testing.
          # volumeMounts:
          #   - name: docker-sock
          #     mountPath: /var/run/docker.sock
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      # Docker-backed testing may add this volume:
      #   - name: docker-sock
      #     hostPath:
      #       path: /var/run/docker.sock
      #       type: Socket
