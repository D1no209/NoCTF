---
# 1. Default Deny All ingress and egress for the noctf namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 2. Allow DNS egress from all pods (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# 3. Allow egress from backend to postgres (5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-postgres
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP

---
# 4. Allow egress from backend to redis (6379)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-redis
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP

---
# 5. Allow ingress to backend from ingress-controller namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP

---
# 6. Allow backend to reach MinIO (S3 storage)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-minio
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-init-to-minio
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: minio-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-minio
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: minio-init
      ports:
        - port: 9000
          protocol: TCP

---
# 7. Allow ingress to postgres only from backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-postgres
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
          protocol: TCP

---
# 7. Allow ingress to redis only from backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-redis
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 6379
          protocol: TCP

---
# 8. Allow ingress to AWD challenge pods only from checker pods (label: app=noctf-checker)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-checker-to-awd-challenges
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: awd-challenge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: noctf-checker

---
# 9. Allow backend to reach runner
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-to-runner
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: runner
      ports:
        - port: 8080
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-runner
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: runner
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 8080
          protocol: TCP

---
---
# 11. Allow runner to talk to the Kubernetes API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-to-kubernetes-api
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: runner
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP

---
# 12. Allow the migration job to reach PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migration-to-postgres
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: migration
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migration-to-postgres
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: migration
      ports:
        - port: 5432
          protocol: TCP

---
# 13. Allow the backend to poll plugin agents in Runner-managed namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-runner-namespaces
  namespace: noctf
  labels:
    app.kubernetes.io/part-of: noctf
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: noctf-runner
