services:
  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: noctf
      POSTGRES_USER: noctf
      POSTGRES_PASSWORD: ${PERF_PASSWORD:?}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "pg_stat_statements.track_planning=${PERF_QUERY_PLANNING:-off}", "-c", "track_io_timing=on"]
    ports: ["127.0.0.1::5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noctf -d noctf"]
      interval: 2s
      timeout: 2s
      retries: 60
  redis:
    image: redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 60
  nats:
    image: nats:2.12.2-alpine@sha256:2d5fce3229ae5741f4ef9225aff95dc4dc036455931eaf77a3eec33fddaa192d
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1::4222", "127.0.0.1::8222"]
    volumes: ["nats:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60
  storage:
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: noctfperf
      RUSTFS_SECRET_KEY: ${PERF_PASSWORD:?}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports: ["127.0.0.1::9000"]
    volumes: ["storage:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 60
volumes:
  postgres:
  nats:
  storage:
