{
  "project_id_env": "CROWDIN_PROJECT_ID",
  "api_token_env": "CROWDIN_PERSONAL_TOKEN",
  "base_path": ".",
  "preserve_hierarchy": true,
  "files": [
    {
      "source": "backend/src/NoCTF.API/ClientApp/app/locales/catalogs/en/*.json",
      "ignore": ["backend/src/NoCTF.API/ClientApp/app/locales/catalogs/en/api.json"],
      "translation": "backend/src/NoCTF.API/ClientApp/app/locales/catalogs/%locale%/%original_file_name%",
      "languages_mapping": { "locale": { "zh-CN": "zh-CN" } }
    },
    {
      "source": "backend/src/NoCTF.API/Localization/Catalogs/en/api.json",
      "translation": "backend/src/NoCTF.API/Localization/Catalogs/%locale%/api.json",
      "languages_mapping": { "locale": { "zh-CN": "zh-CN" } }
    }
  ]
}
