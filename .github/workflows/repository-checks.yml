name: Repository checks

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contracts:
    name: Generated API contract and client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/src/NoCTF.API/ClientApp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4
        with:
          dotnet-version: 10.0.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run api:check
      - run: bun run typecheck
      - run: bun run audit:architecture
      - run: bun run test
      - run: bun run generate

  backend:
    name: Backend unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore test dependencies
        run: dotnet restore tests/NoCTF.Tests/NoCTF.Tests.csproj
      - name: Run non-integration tests
        run: >-
          dotnet test tests/NoCTF.Tests/NoCTF.Tests.csproj
          --no-restore
          --treenode-filter '/*/*/*/*[Category!=Integration]'
          --minimum-expected-tests 1
          -p:BuildSpaOnPublish=false

  integration:
    name: Backend Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOCTF_REQUIRE_DOCKER_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4
        with:
          dotnet-version: 10.0.x
      - name: Verify Docker is available
        run: docker info
      - name: Run real dependency integration tests
        working-directory: backend
        run: >-
          dotnet test tests/NoCTF.Tests/NoCTF.Tests.csproj
          --treenode-filter '/*/*/*/*[Category=Integration]'
          --maximum-parallel-tests 1
          --minimum-expected-tests 38
          -p:BuildSpaOnPublish=false
