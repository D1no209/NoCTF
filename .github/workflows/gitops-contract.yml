name: GitOps contract

on:
  pull_request:
    paths:
      - .github/workflows/gitops-contract.yml
      - backend/artifacts/openapi/swagger.json
      - backend/src/NoCTF.API/Endpoints/Administration/ChallengeBank/**
      - backend/src/NoCTF.API/Endpoints/Administration/Challenges/**
      - backend/tests/NoCTF.Tests/Architecture/GitOpsApiOpenApiContractTests.cs
      - backend/tests/NoCTF.Tests/Integration/API/GitOpsRepositoryHttpTests.cs
      - backend/tests/NoCTF.Tests/Integration/API/GitOpsTemplateFixtureTests.cs
  push:
    branches: [main]
    paths:
      - .github/workflows/gitops-contract.yml
      - backend/artifacts/openapi/swagger.json
      - backend/src/NoCTF.API/Endpoints/Administration/ChallengeBank/**
      - backend/src/NoCTF.API/Endpoints/Administration/Challenges/**
      - backend/tests/NoCTF.Tests/Architecture/GitOpsApiOpenApiContractTests.cs
      - backend/tests/NoCTF.Tests/Integration/API/GitOpsRepositoryHttpTests.cs
      - backend/tests/NoCTF.Tests/Integration/API/GitOpsTemplateFixtureTests.cs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out NoCTF
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: noctf
      - name: Check out pinned GitOps repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: D1no209/NoCTF-Challenge-Template
          ref: 794651c0bf158fa98fdacf88cb0f3a52b9db4b2b
          path: template
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
      - name: Validate GitOps OpenAPI contract
        working-directory: noctf/backend
        run: >-
          dotnet test tests/NoCTF.Tests/NoCTF.Tests.csproj
          --treenode-filter '/*/*/GitOpsApiOpenApiContractTests/*'
          --minimum-expected-tests 4
      - name: Validate every typed fixture
        working-directory: noctf/backend
        env:
          NOCTF_GITOPS_TEMPLATE_ROOT: ${{ github.workspace }}/template
        run: >-
          dotnet test tests/NoCTF.Tests/NoCTF.Tests.csproj
          --no-build
          --treenode-filter '/*/*/GitOpsTemplateFixtureTests/*'
          --minimum-expected-tests 1
      - name: Run real GitOps HTTP contract
        working-directory: noctf/backend
        env:
          NOCTF_GITOPS_TEMPLATE_ROOT: ${{ github.workspace }}/template
          NOCTF_REQUIRE_DOCKER_INTEGRATION: 'true'
        run: >-
          dotnet test tests/NoCTF.Tests/NoCTF.Tests.csproj
          --no-build
          --treenode-filter '/*/*/GitOpsRepositoryHttpTests/*'
          --minimum-expected-tests 1
