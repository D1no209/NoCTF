name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: noctf
          POSTGRES_USER: noctf
          POSTGRES_PASSWORD: noctf_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noctf -d noctf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.10@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.300'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Restore backend
        run: dotnet restore backend/NoCTF.slnx --locked-mode

      - name: Audit backend dependencies
        shell: bash
        run: |
          dotnet list backend/NoCTF.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          if grep -q '"vulnerabilities"' vulnerable.json; then
            cat vulnerable.json
            exit 1
          fi
          dotnet list backend/NoCTF.slnx package --deprecated --include-transitive --format json > deprecated.json
          if grep -q '"deprecationReasons"' deprecated.json; then
            cat deprecated.json
            exit 1
          fi

      - name: Build backend
        run: dotnet build backend/NoCTF.slnx --configuration Release --no-restore

      - name: Verify API and frontend publish artifact
        shell: bash
        run: |
          dotnet publish backend/src/NoCTF.API/NoCTF.API.csproj --configuration Release --no-build --no-restore --output artifacts/api
          test -f artifacts/api/NoCTF.API.dll
          test -f artifacts/api/wwwroot/index.html
          test -f artifacts/api/wwwroot/200.html
          test -f artifacts/api/wwwroot/404.html
          dotnet publish backend/src/NoCTF.Host/NoCTF.Host.csproj --configuration Release --no-build --no-restore --output artifacts/host
          test -f artifacts/host/NoCTF.Host.dll
          test -f artifacts/host/wwwroot/index.html
          test -f artifacts/host/wwwroot/200.html
          test -f artifacts/host/wwwroot/404.html
          dotnet publish backend/src/NoCTF.Worker/NoCTF.Worker.csproj --configuration Release --no-build --no-restore --output artifacts/worker
          test -f artifacts/worker/NoCTF.Worker.dll
          dotnet publish backend/src/NoCTF.Runner/NoCTF.Runner.csproj --configuration Release --no-build --no-restore --output artifacts/runner
          test -f artifacts/runner/NoCTF.Runner.dll

      - name: Test backend
        env:
          NOCTF_REDIS_INTEGRATION: 127.0.0.1:6379,abortConnect=false
          NOCTF_POSTGRES_INTEGRATION: Host=localhost;Port=5432;Database=noctf;Username=noctf;Password=noctf_test_password
          NOCTF_REQUIRE_DOCKER_INTEGRATION: 'true'
        run: dotnet test backend/NoCTF.slnx --configuration Release --no-build

      - name: Verify analyzers and migration model
        shell: bash
        run: |
          dotnet format backend/NoCTF.slnx analyzers --verify-no-changes --no-restore --severity warn
          dotnet tool install --global dotnet-ef --version 10.0.9
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/NoCTF.Infrastructure/NoCTF.Infrastructure.csproj \
            --startup-project backend/src/NoCTF.API/NoCTF.API.csproj \
            --configuration Release --no-build

      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm
          -v "$PWD/deploy/k8s:/manifests:ro"
          ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -ignore-missing-schemas -summary /manifests

      - name: Validate Compose deployment
        env:
          POSTGRES_PASSWORD: ci-postgres-password-123456
          JWT_SECRET: ci-jwt-secret-value-with-at-least-32-characters
          SEED_ADMIN_PASSWORD: ci-admin-password-123456
          RUNNER_API_KEY: ci-runner-api-key-value-123456789
          MINIO_ROOT_PASSWORD: ci-minio-password-123456
          LOCAL_STORAGE_URL_SIGNING_KEY: ci-local-storage-signing-key-with-at-least-32-characters
          EMAIL_VERIFICATION_ENCRYPTION_KEY: Y2ktZW1haWwtZW5jcnlwdGlvbi1rZXktMzItYnl0ZSE=
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.single.yml config -q

      - name: Rehearse PostgreSQL, Wolverine, and object recovery
        shell: bash
        run: |
          for script in deploy/recovery/*.sh; do bash -n "$script"; done
          bash deploy/recovery/rehearse.sh

      - name: Verify OpenAPI artifact
        shell: bash
        run: |
          dotnet run --project backend/src/NoCTF.API/NoCTF.API.csproj --configuration Release --no-build --no-launch-profile -- --export-openapi
          git diff --exit-code backend/artifacts/openapi/swagger.json backend/src/NoCTF.API/wwwroot/openapi/v1.json

  deploy-production:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: noctf-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.NOCTF_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.NOCTF_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.NOCTF_DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.NOCTF_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.NOCTF_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.NOCTF_DEPLOY_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${DEPLOY_HOST:?NOCTF_DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?NOCTF_DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?NOCTF_DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?NOCTF_DEPLOY_KNOWN_HOSTS is required}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/noctf_deploy"
          chmod 600 "$HOME/.ssh/noctf_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package exact commit
        shell: bash
        run: |
          kompose_version=1.38.0
          kompose_sha256=65a6a720605bead3964e8b22d423a0763de451a236fe03de902e366cf3d9c147
          kompose_asset="$RUNNER_TEMP/kompose-linux-amd64"
          curl --fail --location --show-error \
            --connect-timeout 15 --max-time 600 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output "$kompose_asset" \
            "https://github.com/kubernetes/kompose/releases/download/v${kompose_version}/kompose-linux-amd64"
          echo "$kompose_sha256  $kompose_asset" | sha256sum -c -
          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/noctf-release.tar.gz" \
            "$GITHUB_SHA"
          tar -tzf "$RUNNER_TEMP/noctf-release.tar.gz" >/dev/null

      - name: Upload and deploy
        shell: bash
        run: |
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          remote_parent=$(dirname "$DEPLOY_PATH")
          remote_upload="$remote_parent/noctf-ci-upload-$GITHUB_SHA"
          release_root="$remote_parent/noctf-releases"
          ssh_options=(
            -i "$HOME/.ssh/noctf_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -p "$DEPLOY_PORT"
          )
          scp_options=(
            -i "$HOME/.ssh/noctf_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -P "$DEPLOY_PORT"
          )
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p -- '$remote_upload'"
          scp "${scp_options[@]}" \
            "$RUNNER_TEMP/noctf-release.tar.gz" \
            "$RUNNER_TEMP/kompose-linux-amd64" \
            deploy/ci/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_upload/"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_upload/deploy.sh' '$remote_upload/noctf-release.tar.gz' '$GITHUB_SHA' '$DEPLOY_PATH' '$release_root' '$remote_upload/kompose-linux-amd64'"

      - name: Remove interrupted upload
        if: always()
        shell: bash
        run: |
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 0
          remote_upload="$(dirname "$DEPLOY_PATH")/noctf-ci-upload-$GITHUB_SHA"
          ssh \
            -i "$HOME/.ssh/noctf_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test \"$(basename "$remote_upload")\" = 'noctf-ci-upload-$GITHUB_SHA' && rm -rf -- '$remote_upload'" \
            || true
