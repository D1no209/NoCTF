name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: noctf
          POSTGRES_USER: noctf
          POSTGRES_PASSWORD: noctf_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noctf -d noctf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.10@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.300'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Test frontend
        working-directory: backend/src/NoCTF.API/ClientApp
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck

      - name: Restore backend
        run: dotnet restore backend/NoCTF.slnx --locked-mode

      - name: Audit backend dependencies
        shell: bash
        run: |
          dotnet list backend/NoCTF.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          if grep -q '"vulnerabilities"' vulnerable.json; then
            cat vulnerable.json
            exit 1
          fi
          dotnet list backend/NoCTF.slnx package --deprecated --include-transitive --format json > deprecated.json
          if grep -q '"deprecationReasons"' deprecated.json; then
            cat deprecated.json
            exit 1
          fi

      - name: Build backend
        run: dotnet build backend/NoCTF.slnx --configuration Release --no-restore

      - name: Verify API and frontend publish artifact
        shell: bash
        run: |
          dotnet publish backend/src/NoCTF.API/NoCTF.API.csproj --configuration Release --no-build --no-restore --output artifacts/api
          test -f artifacts/api/NoCTF.API.dll
          test -f artifacts/api/wwwroot/index.html
          test -f artifacts/api/wwwroot/200.html
          test -f artifacts/api/wwwroot/404.html
          dotnet publish backend/src/NoCTF.Host/NoCTF.Host.csproj --configuration Release --no-build --no-restore --output artifacts/host
          test -f artifacts/host/NoCTF.Host.dll
          test -f artifacts/host/wwwroot/index.html
          test -f artifacts/host/wwwroot/200.html
          test -f artifacts/host/wwwroot/404.html
          dotnet publish backend/src/NoCTF.Worker/NoCTF.Worker.csproj --configuration Release --no-build --no-restore --output artifacts/worker
          test -f artifacts/worker/NoCTF.Worker.dll
          dotnet publish backend/src/NoCTF.Runner/NoCTF.Runner.csproj --configuration Release --no-build --no-restore --output artifacts/runner
          test -f artifacts/runner/NoCTF.Runner.dll

      - name: Test backend
        env:
          NOCTF_REDIS_INTEGRATION: 127.0.0.1:6379,abortConnect=false
          NOCTF_POSTGRES_INTEGRATION: Host=localhost;Port=5432;Database=noctf;Username=noctf;Password=noctf_test_password
          NOCTF_REQUIRE_DOCKER_INTEGRATION: 'true'
        run: dotnet test backend/NoCTF.slnx --configuration Release --no-build

      - name: Verify analyzers and migration model
        shell: bash
        run: |
          dotnet format backend/NoCTF.slnx analyzers --verify-no-changes --no-restore --severity warn
          dotnet tool install --global dotnet-ef --version 10.0.9
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/NoCTF.Infrastructure/NoCTF.Infrastructure.csproj \
            --startup-project backend/src/NoCTF.API/NoCTF.API.csproj \
            --configuration Release --no-build

      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm
          -v "$PWD/deploy/k8s:/manifests:ro"
          ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -ignore-missing-schemas -summary /manifests

      - name: Validate Compose deployment
        env:
          POSTGRES_PASSWORD: ci-postgres-password-123456
          JWT_SECRET: ci-jwt-secret-value-with-at-least-32-characters
          SEED_ADMIN_PASSWORD: ci-admin-password-123456
          RUNNER_API_KEY: ci-runner-api-key-value-123456789
          MINIO_ROOT_PASSWORD: ci-minio-password-123456
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password-123456
          LOCAL_STORAGE_URL_SIGNING_KEY: ci-local-storage-signing-key-with-at-least-32-characters
          EMAIL_VERIFICATION_ENCRYPTION_KEY: Y2ktZW1haWwtZW5jcnlwdGlvbi1rZXktMzItYnl0ZSE=
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.observability.yml config -q
          docker compose -f deploy/docker-compose.single.yml config -q

      - name: Rehearse PostgreSQL, Wolverine, and object recovery
        shell: bash
        run: |
          for script in deploy/recovery/*.sh; do bash -n "$script"; done
          bash deploy/recovery/rehearse.sh

      - name: Verify OpenAPI artifact
        shell: bash
        run: |
          dotnet run --project backend/src/NoCTF.API/NoCTF.API.csproj --configuration Release --no-build --no-launch-profile -- --export-openapi
          git diff --exit-code backend/artifacts/openapi/swagger.json backend/src/NoCTF.API/wwwroot/openapi/v1.json

  publish-images:
    name: Publish application image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CUSTOM_REGISTRY: ${{ vars.CUSTOM_REGISTRY }}
      CUSTOM_REGISTRY_NAMESPACE: ${{ vars.CUSTOM_REGISTRY_NAMESPACE }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate custom registry configuration
        if: env.CUSTOM_REGISTRY != ''
        env:
          CUSTOM_REGISTRY_USERNAME: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          CUSTOM_REGISTRY_PASSWORD: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CUSTOM_REGISTRY_USERNAME:?CUSTOM_REGISTRY_USERNAME is required when CUSTOM_REGISTRY is set}"
          : "${CUSTOM_REGISTRY_PASSWORD:?CUSTOM_REGISTRY_PASSWORD is required when CUSTOM_REGISTRY is set}"
          [[ "$CUSTOM_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          if [[ -n "$CUSTOM_REGISTRY_NAMESPACE" ]]; then
            [[ "$CUSTOM_REGISTRY_NAMESPACE" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]
          fi

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          set -Eeuo pipefail
          repository_owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name="${repository_name,,}"
          custom_namespace="${CUSTOM_REGISTRY_NAMESPACE:-$repository_owner}"
          custom_namespace="${custom_namespace,,}"
          version_prefix="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' backend/Directory.Build.props)"
          version_suffix="$(sed -n 's:.*<VersionSuffix>\([^<]*\)</VersionSuffix>.*:\1:p' backend/Directory.Build.props)"
          : "${version_prefix:?VersionPrefix is missing from backend/Directory.Build.props}"
          version="$version_prefix"
          if [[ -n "$version_suffix" ]]; then
            version="$version-$version_suffix"
          fi
          {
            echo 'names<<EOF'
            echo "ghcr.io/$repository_owner/$repository_name"
            if [[ -n "$CUSTOM_REGISTRY" ]]; then
              echo "$CUSTOM_REGISTRY/$custom_namespace/$repository_name"
            fi
            echo 'EOF'
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom registry
        if: env.CUSTOM_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CUSTOM_REGISTRY }}
          username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.names }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.images.outputs.version }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          target: host
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=noctf-host
          cache-to: type=gha,mode=max,scope=noctf-host
