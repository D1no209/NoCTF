name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-images:
    name: Publish application image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CUSTOM_REGISTRY: ${{ vars.CUSTOM_REGISTRY }}
      CUSTOM_REGISTRY_NAMESPACE: ${{ vars.CUSTOM_REGISTRY_NAMESPACE }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate custom registry configuration
        if: env.CUSTOM_REGISTRY != ''
        env:
          CUSTOM_REGISTRY_USERNAME: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          CUSTOM_REGISTRY_PASSWORD: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CUSTOM_REGISTRY_USERNAME:?CUSTOM_REGISTRY_USERNAME is required when CUSTOM_REGISTRY is set}"
          : "${CUSTOM_REGISTRY_PASSWORD:?CUSTOM_REGISTRY_PASSWORD is required when CUSTOM_REGISTRY is set}"
          [[ "$CUSTOM_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          if [[ -n "$CUSTOM_REGISTRY_NAMESPACE" ]]; then
            [[ "$CUSTOM_REGISTRY_NAMESPACE" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]
          fi

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          set -Eeuo pipefail
          repository_owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name="${repository_name,,}"
          custom_namespace="${CUSTOM_REGISTRY_NAMESPACE:-$repository_owner}"
          custom_namespace="${custom_namespace,,}"
          version_prefix="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' backend/Directory.Build.props)"
          version_suffix="$(sed -n 's:.*<VersionSuffix>\([^<]*\)</VersionSuffix>.*:\1:p' backend/Directory.Build.props)"
          : "${version_prefix:?VersionPrefix is missing from backend/Directory.Build.props}"
          version="$version_prefix"
          if [[ -n "$version_suffix" ]]; then
            version="$version-$version_suffix"
          fi
          {
            echo 'names<<EOF'
            echo "ghcr.io/$repository_owner/$repository_name"
            if [[ -n "$CUSTOM_REGISTRY" ]]; then
              echo "$CUSTOM_REGISTRY/$custom_namespace/$repository_name"
            fi
            echo 'EOF'
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom registry
        if: env.CUSTOM_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CUSTOM_REGISTRY }}
          username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.names }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.images.outputs.version }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          target: host
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=noctf-host
          cache-to: type=gha,mode=max,scope=noctf-host
