name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-images:
    name: Publish application image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CUSTOM_REGISTRY: ${{ vars.CUSTOM_REGISTRY }}
      CUSTOM_REGISTRY_NAMESPACE: ${{ vars.CUSTOM_REGISTRY_NAMESPACE }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate repository translations and prepare Crowdin staging
        id: translations
        env:
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_TOKEN_AVAILABLE: ${{ secrets.CROWDIN_PERSONAL_TOKEN != '' }}
        run: bun backend/scripts/Sync-Translations.ts prepare .

      - name: Upload English sources and download latest translations
        id: crowdin
        if: steps.translations.outputs.enabled == 'true'
        continue-on-error: true
        uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3
        with:
          config: .crowdin-stage.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          download_language: zh-CN
          skip_untranslated_strings: true
          export_only_approved: false
          push_translations: false
          create_pull_request: false
          skip_ref_checkout: true
        env:
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Apply validated translations or use repository fallback
        env:
          CROWDIN_OUTCOME: ${{ steps.translations.outputs.enabled == 'true' && steps.crowdin.outcome || 'disabled' }}
        run: bun backend/scripts/Sync-Translations.ts apply .

      - name: Validate custom registry configuration
        if: env.CUSTOM_REGISTRY != ''
        env:
          CUSTOM_REGISTRY_USERNAME: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          CUSTOM_REGISTRY_PASSWORD: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CUSTOM_REGISTRY_USERNAME:?CUSTOM_REGISTRY_USERNAME is required when CUSTOM_REGISTRY is set}"
          : "${CUSTOM_REGISTRY_PASSWORD:?CUSTOM_REGISTRY_PASSWORD is required when CUSTOM_REGISTRY is set}"
          [[ "$CUSTOM_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          if [[ -n "$CUSTOM_REGISTRY_NAMESPACE" ]]; then
            [[ "$CUSTOM_REGISTRY_NAMESPACE" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]
          fi

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          set -Eeuo pipefail
          repository_owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name="${repository_name,,}"
          custom_namespace="${CUSTOM_REGISTRY_NAMESPACE:-$repository_owner}"
          custom_namespace="${custom_namespace,,}"
          version_prefix="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' backend/Directory.Build.props)"
          version_suffix="$(sed -n 's:.*<VersionSuffix>\([^<]*\)</VersionSuffix>.*:\1:p' backend/Directory.Build.props)"
          : "${version_prefix:?VersionPrefix is missing from backend/Directory.Build.props}"
          version="$version_prefix"
          if [[ -n "$version_suffix" ]]; then
            version="$version-$version_suffix"
          fi
          {
            echo 'names<<EOF'
            echo "ghcr.io/$repository_owner/$repository_name"
            if [[ -n "$CUSTOM_REGISTRY" ]]; then
              echo "$CUSTOM_REGISTRY/$custom_namespace/$repository_name"
            fi
            echo 'EOF'
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom registry
        if: env.CUSTOM_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CUSTOM_REGISTRY }}
          username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.names }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.images.outputs.version }}
            type=raw,value=sha-${{ github.sha }}

      - name: Package the source used by this build
        run: >-
          python3 backend/scripts/Package-Source.py
          --output "${{ runner.temp }}/noctf-source-${{ github.sha }}.tar.gz"

      - name: Upload corresponding build source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noctf-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/noctf-source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/noctf-source-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          target: host
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=noctf-host
          cache-to: type=gha,mode=max,scope=noctf-host,ignore-error=true

      - name: Package deployment configuration
        id: deployment
        env:
          IMAGE_NAMES: ${{ steps.images.outputs.names }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_VERSION: ${{ steps.images.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          package_root="$RUNNER_TEMP/noctf-deployment"
          mkdir -p "$package_root"
          # Export only tracked deployment files, including .env.example templates.
          git archive HEAD deploy | tar -x -C "$package_root"
          export PACKAGE_ROOT="$package_root"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          digest = os.environ['IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[a-f0-9]{64}', digest):
              raise SystemExit('The published Host image digest is missing or invalid.')
          images = [name + '@' + digest for name in os.environ['IMAGE_NAMES'].splitlines() if name]
          if not images:
              raise SystemExit('No published image repository was recorded.')
          metadata = {
              'revision': os.environ['GITHUB_SHA'],
              'version': os.environ['IMAGE_VERSION'],
              'image': images[0],
              'images': images,
          }
          (Path(os.environ['PACKAGE_ROOT']) / 'deployment.json').write_text(
              json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Install NoCTF\n\nDownload the matching `noctf-deploy-' +
                            metadata['revision'] + '` artifact below.\n\n')
              summary.write('Published complete Host images:\n\n')
              for image in images:
                  summary.write('- `' + image + '`\n')
          PY
          archive="noctf-deploy-$GITHUB_SHA.tar.gz"
          tar -czf "$RUNNER_TEMP/$archive" -C "$package_root" deploy deployment.json
          (cd "$RUNNER_TEMP" && sha256sum "$archive" > "$archive.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload deployment configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noctf-deploy-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ steps.deployment.outputs.archive }}
            ${{ runner.temp }}/${{ steps.deployment.outputs.archive }}.sha256
          if-no-files-found: error
