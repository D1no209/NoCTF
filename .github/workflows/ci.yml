name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-images:
    name: Publish application image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CUSTOM_REGISTRY: ${{ vars.CUSTOM_REGISTRY }}
      CUSTOM_REGISTRY_NAMESPACE: ${{ vars.CUSTOM_REGISTRY_NAMESPACE }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate custom registry configuration
        if: env.CUSTOM_REGISTRY != ''
        env:
          CUSTOM_REGISTRY_USERNAME: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          CUSTOM_REGISTRY_PASSWORD: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CUSTOM_REGISTRY_USERNAME:?CUSTOM_REGISTRY_USERNAME is required when CUSTOM_REGISTRY is set}"
          : "${CUSTOM_REGISTRY_PASSWORD:?CUSTOM_REGISTRY_PASSWORD is required when CUSTOM_REGISTRY is set}"
          [[ "$CUSTOM_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          if [[ -n "$CUSTOM_REGISTRY_NAMESPACE" ]]; then
            [[ "$CUSTOM_REGISTRY_NAMESPACE" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]
          fi

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          set -Eeuo pipefail
          repository_owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name="${repository_name,,}"
          custom_namespace="${CUSTOM_REGISTRY_NAMESPACE:-$repository_owner}"
          custom_namespace="${custom_namespace,,}"
          version_prefix="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' backend/Directory.Build.props)"
          version_suffix="$(sed -n 's:.*<VersionSuffix>\([^<]*\)</VersionSuffix>.*:\1:p' backend/Directory.Build.props)"
          : "${version_prefix:?VersionPrefix is missing from backend/Directory.Build.props}"
          version="$version_prefix"
          if [[ -n "$version_suffix" ]]; then
            version="$version-$version_suffix"
          fi
          {
            echo 'names<<EOF'
            echo "ghcr.io/$repository_owner/$repository_name"
            if [[ -n "$CUSTOM_REGISTRY" ]]; then
              echo "$CUSTOM_REGISTRY/$custom_namespace/$repository_name"
            fi
            echo 'EOF'
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom registry
        if: env.CUSTOM_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CUSTOM_REGISTRY }}
          username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.names }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.images.outputs.version }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          target: host
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=noctf-host
          cache-to: type=gha,mode=max,scope=noctf-host,ignore-error=true

  deploy-production:
    name: Deploy production
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: noctf-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.NOCTF_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.NOCTF_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.NOCTF_DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.NOCTF_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.NOCTF_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.NOCTF_DEPLOY_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?NOCTF_DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?NOCTF_DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?NOCTF_DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?NOCTF_DEPLOY_KNOWN_HOSTS is required}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/noctf_deploy"
          chmod 600 "$HOME/.ssh/noctf_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package exact commit
        shell: bash
        run: |
          set -Eeuo pipefail
          kompose_version=1.38.0
          kompose_sha256=65a6a720605bead3964e8b22d423a0763de451a236fe03de902e366cf3d9c147
          kompose_asset="$RUNNER_TEMP/kompose-linux-amd64"
          curl --fail --location --show-error \
            --connect-timeout 15 --max-time 600 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output "$kompose_asset" \
            "https://github.com/kubernetes/kompose/releases/download/v${kompose_version}/kompose-linux-amd64"
          echo "$kompose_sha256  $kompose_asset" | sha256sum -c -
          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/noctf-release.tar.gz" \
            "$GITHUB_SHA"
          tar -tzf "$RUNNER_TEMP/noctf-release.tar.gz" >/dev/null

      - name: Upload and deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          remote_parent=$(dirname "$DEPLOY_PATH")
          remote_upload="$remote_parent/noctf-ci-upload-$GITHUB_SHA"
          release_root="$remote_parent/noctf-releases"
          kompose_sha256=65a6a720605bead3964e8b22d423a0763de451a236fe03de902e366cf3d9c147
          ssh_options=(
            -i "$HOME/.ssh/noctf_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -p "$DEPLOY_PORT"
          )
          scp_options=(
            -i "$HOME/.ssh/noctf_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -P "$DEPLOY_PORT"
          )
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p -- '$remote_upload'"

          if ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$release_root' '$remote_upload' '$kompose_sha256'" <<'CACHE_KOMPOSE'
          set -Eeuo pipefail
          release_root=$1
          remote_upload=$2
          kompose_sha256=$3
          cached_kompose="$release_root/current/backend/docker-assets/kompose-linux-amd64"
          [[ -f "$cached_kompose" ]]
          echo "$kompose_sha256  $cached_kompose" | sha256sum -c -
          install -m 0644 "$cached_kompose" "$remote_upload/kompose-linux-amd64"
          CACHE_KOMPOSE
          then
            echo "Reused the verified Kompose asset from the current server release."
          else
            scp "${scp_options[@]}" \
              "$RUNNER_TEMP/kompose-linux-amd64" \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_upload/kompose-linux-amd64"
          fi

          scp "${scp_options[@]}" \
            "$RUNNER_TEMP/noctf-release.tar.gz" \
            deploy/ci/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_upload/"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_upload/deploy.sh' '$remote_upload/noctf-release.tar.gz' '$GITHUB_SHA' '$DEPLOY_PATH' '$release_root' '$remote_upload/kompose-linux-amd64'"

      - name: Remove interrupted upload
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 0
          remote_upload="$(dirname "$DEPLOY_PATH")/noctf-ci-upload-$GITHUB_SHA"
          ssh \
            -i "$HOME/.ssh/noctf_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test \"$(basename "$remote_upload")\" = 'noctf-ci-upload-$GITHUB_SHA' && rm -rf -- '$remote_upload'" \
            || true
