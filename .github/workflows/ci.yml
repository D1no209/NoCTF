name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noctf
          POSTGRES_USER: noctf
          POSTGRES_PASSWORD: noctf_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noctf -d noctf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Restore backend
        run: dotnet restore backend/NoCTF.slnx --locked-mode

      - name: Audit backend dependencies
        shell: bash
        run: |
          dotnet list backend/NoCTF.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          if grep -q '"vulnerabilities"' vulnerable.json; then
            cat vulnerable.json
            exit 1
          fi
          dotnet list backend/NoCTF.slnx package --deprecated --include-transitive --format json > deprecated.json
          if grep -q '"deprecationReasons"' deprecated.json; then
            cat deprecated.json
            exit 1
          fi

      - name: Build backend
        run: dotnet build backend/NoCTF.slnx --configuration Release --no-restore

      - name: Verify API publish artifact
        shell: bash
        run: |
          dotnet publish backend/src/NoCTF.API/NoCTF.API.csproj --configuration Release --no-build --no-restore --output artifacts/api /p:BuildSpaOnPublish=false
          test -f artifacts/api/NoCTF.API.dll

      - name: Test backend
        env:
          NOCTF_REDIS_INTEGRATION: 127.0.0.1:6379,abortConnect=false
          NOCTF_POSTGRES_INTEGRATION: Host=localhost;Port=5432;Database=noctf;Username=noctf;Password=noctf_test_password
        run: dotnet test backend/NoCTF.slnx --configuration Release --no-build

      - name: Verify analyzers and migration model
        shell: bash
        run: |
          dotnet format backend/NoCTF.slnx analyzers --verify-no-changes --no-restore --severity warn
          dotnet tool install --global dotnet-ef --version 8.0.11
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/NoCTF.Infrastructure/NoCTF.Infrastructure.csproj \
            --startup-project backend/src/NoCTF.API/NoCTF.API.csproj \
            --configuration Release --no-build

      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm
          -v "$PWD/deploy/k8s:/manifests:ro"
          ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary /manifests

      - name: Validate Compose deployment
        env:
          POSTGRES_PASSWORD: ci-postgres-password-123456
          JWT_SECRET: ci-jwt-secret-value-with-at-least-32-characters
          SEED_ADMIN_PASSWORD: ci-admin-password-123456
          RUNNER_API_KEY: ci-runner-api-key-value-123456789
          MINIO_ROOT_PASSWORD: ci-minio-password-123456
          LOCAL_STORAGE_URL_SIGNING_KEY: ci-local-storage-signing-key-with-at-least-32-characters
        run: docker compose -f deploy/docker-compose.yml config -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Generate OpenAPI artifact and client
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__PostgreSql: Host=localhost;Port=5432;Database=noctf;Username=noctf;Password=noctf_test_password
          ConnectionStrings__Redis: localhost:6379
          Authentication__SigningKey: ci_secret_value_with_at_least_32_chars
          RunnerScoring__SigningKey: ci_runner_scoring_value_with_at_least_32_chars
          Database__AutoMigrate: 'true'
        run: |
          dotnet run --project backend/src/NoCTF.API/NoCTF.API.csproj &
          api_pid=$!
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5000/health >/dev/null
          cd frontend
          bun run fetch-openapi
          bun run generate-api
          cd ..
          kill "$api_pid"
          git diff --exit-code frontend/src/api/generated frontend/src/api/client-config.ts
