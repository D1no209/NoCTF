name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-images:
    name: Publish application image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CUSTOM_REGISTRY: ${{ vars.CUSTOM_REGISTRY }}
      CUSTOM_REGISTRY_NAMESPACE: ${{ vars.CUSTOM_REGISTRY_NAMESPACE }}
    outputs:
      deployment-image: ${{ format('{0}@{1}', steps.images.outputs.deployment_repository, steps.build.outputs.digest) }}
      deployment-registry: ${{ steps.images.outputs.deployment_registry }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test deployment updater
        run: python3 -m unittest discover -s deploy/ci -p 'test_*.py'

      - name: Validate custom registry configuration
        if: env.CUSTOM_REGISTRY != ''
        env:
          CUSTOM_REGISTRY_USERNAME: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          CUSTOM_REGISTRY_PASSWORD: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CUSTOM_REGISTRY_USERNAME:?CUSTOM_REGISTRY_USERNAME is required when CUSTOM_REGISTRY is set}"
          : "${CUSTOM_REGISTRY_PASSWORD:?CUSTOM_REGISTRY_PASSWORD is required when CUSTOM_REGISTRY is set}"
          [[ "$CUSTOM_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          if [[ -n "$CUSTOM_REGISTRY_NAMESPACE" ]]; then
            [[ "$CUSTOM_REGISTRY_NAMESPACE" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]
          fi

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          set -Eeuo pipefail
          repository_owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_name="${repository_name,,}"
          custom_namespace="${CUSTOM_REGISTRY_NAMESPACE:-$repository_owner}"
          custom_namespace="${custom_namespace,,}"
          deployment_registry=ghcr.io
          deployment_repository="ghcr.io/$repository_owner/$repository_name"
          if [[ -n "$CUSTOM_REGISTRY" ]]; then
            deployment_registry="$CUSTOM_REGISTRY"
            deployment_repository="$CUSTOM_REGISTRY/$custom_namespace/$repository_name"
          fi
          version_prefix="$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' backend/Directory.Build.props)"
          version_suffix="$(sed -n 's:.*<VersionSuffix>\([^<]*\)</VersionSuffix>.*:\1:p' backend/Directory.Build.props)"
          : "${version_prefix:?VersionPrefix is missing from backend/Directory.Build.props}"
          version="$version_prefix"
          if [[ -n "$version_suffix" ]]; then
            version="$version-$version_suffix"
          fi
          {
            echo 'names<<EOF'
            echo "ghcr.io/$repository_owner/$repository_name"
            if [[ -n "$CUSTOM_REGISTRY" ]]; then
              echo "$CUSTOM_REGISTRY/$custom_namespace/$repository_name"
            fi
            echo 'EOF'
            echo "version=$version"
            echo "deployment_registry=$deployment_registry"
            echo "deployment_repository=$deployment_repository"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom registry
        if: env.CUSTOM_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CUSTOM_REGISTRY }}
          username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.names }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.images.outputs.version }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          target: host
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=noctf-host
          cache-to: type=gha,mode=max,scope=noctf-host,ignore-error=true

  deploy-test:
    name: Deploy test server
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Legacy environment name: these credentials belong to the test server.
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: noctf-test-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.NOCTF_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.NOCTF_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.NOCTF_DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.NOCTF_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.NOCTF_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.NOCTF_DEPLOY_KNOWN_HOSTS }}
      DEPLOY_IMAGE: ${{ needs.publish-images.outputs.deployment-image }}
      DEPLOY_REGISTRY: ${{ needs.publish-images.outputs.deployment-registry }}
      DEPLOY_REGISTRY_USERNAME: ${{ vars.CUSTOM_REGISTRY != '' && secrets.CUSTOM_REGISTRY_USERNAME || github.actor }}
      DEPLOY_REGISTRY_PASSWORD: ${{ vars.CUSTOM_REGISTRY != '' && secrets.CUSTOM_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?NOCTF_DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?NOCTF_DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?NOCTF_DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?NOCTF_DEPLOY_KNOWN_HOSTS is required}"
          : "${DEPLOY_IMAGE:?published deployment image is required}"
          : "${DEPLOY_REGISTRY:?deployment registry is required}"
          : "${DEPLOY_REGISTRY_USERNAME:?deployment registry username is required}"
          : "${DEPLOY_REGISTRY_PASSWORD:?deployment registry password is required}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]
          case "${DEPLOY_HOST,,}" in
            172.26.106.246|noctf.d1no.cn)
              echo 'Production is not an allowed CI deployment target.' >&2
              exit 1
              ;;
          esac
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$DEPLOY_REGISTRY_USERNAME" =~ ^[A-Za-z0-9._@-]+$ ]]
          [[ "$DEPLOY_IMAGE" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/noctf_deploy"
          chmod 600 "$HOME/.ssh/noctf_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host noctf-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile $HOME/.ssh/noctf_deploy
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Verify test server identity
        id: verify_test_target
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_hostname=$(ssh noctf-deploy hostname)
          if [[ "${remote_hostname,,}" == dino209 ]]; then
            echo 'Refusing to write to the production server.' >&2
            exit 1
          fi

      - name: Package exact commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/noctf-release.tar.gz" \
            "$GITHUB_SHA" \
            backend/Directory.Build.props \
            deploy/ci/update_image.py
          tar -tzf "$RUNNER_TEMP/noctf-release.tar.gz" >/dev/null

      - name: Upload exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          remote_parent=$(dirname "$DEPLOY_PATH")
          remote_upload="$remote_parent/noctf-ci-upload-$GITHUB_SHA"
          ssh noctf-deploy "mkdir -p -- '$remote_upload'"
          scp \
            "$RUNNER_TEMP/noctf-release.tar.gz" \
            deploy/ci/deploy.sh \
            "noctf-deploy:$remote_upload/"

      - name: Authenticate deployment registry
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' "$DEPLOY_REGISTRY_PASSWORD" \
            | ssh noctf-deploy \
                "docker login '$DEPLOY_REGISTRY' --username '$DEPLOY_REGISTRY_USERNAME' --password-stdin"

      - name: Deploy exact image
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          remote_parent=$(dirname "$DEPLOY_PATH")
          remote_upload="$remote_parent/noctf-ci-upload-$GITHUB_SHA"
          release_root="$remote_parent/noctf-releases"
          ssh noctf-deploy \
            "bash '$remote_upload/deploy.sh' '$remote_upload/noctf-release.tar.gz' '$GITHUB_SHA' '$DEPLOY_PATH' '$release_root' '$DEPLOY_IMAGE'"

      - name: Remove interrupted upload
        if: always() && steps.verify_test_target.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH=${DEPLOY_PATH:-/root/NoCTF}
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 0
          remote_upload="$(dirname "$DEPLOY_PATH")/noctf-ci-upload-$GITHUB_SHA"
          ssh noctf-deploy \
            "test \"$(basename "$remote_upload")\" = 'noctf-ci-upload-$GITHUB_SHA' && rm -rf -- '$remote_upload'" \
            || true
