name: Build optional public gateway

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow only publishes branch-specific images. It never deploys either server.
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: host
            repository: noctf
            dockerfile: backend/Dockerfile
            target: host
          - component: gateway
            repository: noctf-public-gateway
            dockerfile: deploy/public-gateway/Dockerfile
            target: ''
          - component: ssh-server
            repository: noctf-gateway-ssh-server
            dockerfile: deploy/public-gateway/ssh/Dockerfile
            target: server
          - component: ssh-client
            repository: noctf-gateway-ssh-client
            dockerfile: deploy/public-gateway/ssh/Dockerfile
            target: client
          - component: relay
            repository: noctf-gateway-relay
            dockerfile: deploy/public-gateway/relay/Dockerfile
            target: ''
    env:
      CUSTOM_REGISTRY: ${{ vars.CUSTOM_REGISTRY }}
      CUSTOM_NAMESPACE: ${{ vars.CUSTOM_REGISTRY_NAMESPACE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: env.CUSTOM_REGISTRY != ''
        with:
          registry: ${{ env.CUSTOM_REGISTRY }}
          username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}
      - name: Branch image names
        id: names
        shell: bash
        run: |
          set -Eeuo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${{ matrix.repository }}"
          tag="gateway-sha-$GITHUB_SHA"
          selected="ghcr.io/$owner/$repo"
          tags="$selected:$tag"
          if [[ -n "$CUSTOM_REGISTRY" ]]; then
            [[ "$CUSTOM_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
            namespace="${CUSTOM_NAMESPACE:-$owner}"
            namespace="${namespace,,}"
            [[ "$namespace" =~ ^[a-z0-9._/-]+$ ]]
            selected="$CUSTOM_REGISTRY/$namespace/$repo"
            tags="$tags,$selected:$tag"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "repository=$selected" >> "$GITHUB_OUTPUT"
      - name: Build immutable branch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=noctf-host
            type=gha,scope=noctf-public-gateway-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=noctf-public-gateway-${{ matrix.component }},ignore-error=true
      - name: Record deployment reference
        shell: bash
        run: |
          printf '%s\n' '${{ steps.names.outputs.repository }}@${{ steps.build.outputs.digest }}' > "$RUNNER_TEMP/${{ matrix.component }}-image.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-${{ matrix.component }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.component }}-image.txt
          retention-days: 7
