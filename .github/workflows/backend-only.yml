name: Build backend only

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Existing deployed Host image with frontend to preserve (immutable digest)
        required: true
        type: string

permissions:
  contents: read

# This workflow publishes an immutable image only. Production deployment remains manual.
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ${{ inputs.base_image }}
      CUSTOM_REGISTRY: ${{ vars.CUSTOM_REGISTRY }}
      CUSTOM_NAMESPACE: ${{ vars.CUSTOM_REGISTRY_NAMESPACE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate backend translations and prepare Crowdin staging
        id: translations
        env:
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_TOKEN_AVAILABLE: ${{ secrets.CROWDIN_PERSONAL_TOKEN != '' }}
        run: bun backend/scripts/Sync-Translations.ts prepare . --backend-only
      - name: Synchronize backend HTTP translations
        id: crowdin
        if: steps.translations.outputs.enabled == 'true'
        continue-on-error: true
        uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3
        with:
          config: .crowdin-stage.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          download_language: zh-CN
          skip_untranslated_strings: true
          export_only_approved: false
          push_translations: false
          create_pull_request: false
          skip_ref_checkout: true
        env:
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      - name: Apply validated backend translations or use repository fallback
        env:
          CROWDIN_OUTCOME: ${{ steps.translations.outputs.enabled == 'true' && steps.crowdin.outcome || 'disabled' }}
        run: bun backend/scripts/Sync-Translations.ts apply . --backend-only
      - name: Prepare backend-only image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$BASE_IMAGE" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?/[A-Za-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ -n "$CUSTOM_REGISTRY" ]]; then
            [[ "$CUSTOM_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
            namespace="${CUSTOM_NAMESPACE:-${GITHUB_REPOSITORY_OWNER,,}}"
            [[ "$namespace" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]
            repository="$CUSTOM_REGISTRY/${namespace,,}/noctf"
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$repository:backend-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: env.CUSTOM_REGISTRY != ''
        with:
          registry: ${{ env.CUSTOM_REGISTRY }}
          username: ${{ secrets.CUSTOM_REGISTRY_USERNAME }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD }}
      - name: Package backend build source and frontend base identity
        env:
          SOURCE_ARCHIVE: ${{ runner.temp }}/noctf-source-backend-${{ github.sha }}.tar.gz
        run: >-
          python3 backend/scripts/Package-Source.py
          --output "$SOURCE_ARCHIVE"
          --frontend-base-image "$BASE_IMAGE"

      - name: Upload backend build source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noctf-source-backend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/noctf-source-backend-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/noctf-source-backend-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error

      - name: Build and publish backend only
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: backend/Dockerfile.backend-only
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=noctf-backend-only
          cache-to: type=gha,mode=max,scope=noctf-backend-only,ignore-error=true
      - name: Record immutable image
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
