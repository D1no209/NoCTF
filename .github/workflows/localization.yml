name: Localization contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/src/NoCTF.API/**'
      - 'backend/scripts/*Translations*'
      - 'backend/tests/NoCTF.Tests/**/ApiLocalizationTests.cs'
      - '.github/workflows/*'
      - 'crowdin.yml'
      - 'backend/Dockerfile'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun test backend/scripts/Translations.test.ts
      - run: bun install --frozen-lockfile
        working-directory: backend/src/NoCTF.API/ClientApp
      - run: bun run typecheck && bun run audit:architecture && bun run test && bun run generate
        working-directory: backend/src/NoCTF.API/ClientApp
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/NoCTF.Tests/NoCTF.Tests.csproj --treenode-filter '/*/*/ApiLocalizationTests/*' --minimum-expected-tests 13 -p:BuildSpaOnPublish=false
        working-directory: backend
